<h3>Filmliste</h3>

<span>Verwaltung und Bewertung deiner Lieblingsfilme</span><br><br>

<button class="btn btn-primary clear" routerLink="/create">
    <i class="bi bi-cloud-plus"></i> 
    Neuen Film hinzufügen
</button>

<hr>

<div class="row g-4 mt-3">
    <div class="col-12 col-lg-6" *ngFor="let item of service.movies">
        <div class="card h-100">
            <div class="row g-0 h-100">
                <div class="col-md-4">
                    <img [src]="item.imgUrl" class="img-fluid rounded-start movie-img" [alt]="item.title">
                </div>

                <div class="col-md-8">
                    <div class="card-body d-flex flex-column h-100">
                        <h5 class="card-title">{{ item.title }}</h5>

                        <p class="card-text">
                            <span class="badge text-bg-light">{{ item.year }}</span>
                        </p>

                        <p class="card-text">
                            <span class="badge" [ngClass]="item.watched ? 'text-bg-success' : 'text-bg-warning'">
                                {{ item.watched ? 'Gesehen' : 'Noch nicht gesehen' }}
                            </span>
                        </p>

                        <p class="card-text">
                            <ng-container *ngIf="item.rating; else noRating">
                                Bewertung: {{ item.rating }}/5
                            </ng-container>

                            <ng-template #noRating>
                                <span class="text-muted">Nicht bewertet</span>
                            </ng-template>
                        </p>

                        <div class="mt-auto">
                            <a routerLink="/edit/{{ item.id }}" class="btn btn-sm btn-outline-primary me-3">
                                <i class="bi bi-pencil-square"></i>
                                Bewertung bearbeiten
                            </a>

                            <button type="button" (click)="delete(item)" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash3"></i>
                                Löschen
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
